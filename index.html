<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You 💖</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ffd6e8, #fff0f6);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: white;
      width: 90%;
      max-width: 360px;
      padding: 35px 20px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.15);
    }

    h1 {
      color: #ff4d8d;
      font-size: 24px;
      margin-bottom: 25px;
    }

    .buttons {
      position: relative;
      height: 90px;
    }

    button {
      border: none;
      border-radius: 40px;
      font-size: 16px;
      cursor: pointer;
      position: absolute;
      transition: all 0.3s ease;
    }

    #yes {
      background: #ff4d8d;
      color: white;
      padding: 14px 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
    }

    #no {
      background: #eee;
      color: #555;
      padding: 12px 25px;
      right: 0;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Will you be my Valentine? 💕</h1>

    <div class="buttons">
      <button id="yes">Yes 💖</button>
      <button id="no">No 😅</button>
    </div>
  </div>

<script>
  const yesBtn = document.getElementById("yes");
  const noBtn = document.getElementById("no");

  let yesSize = 1;

  noBtn.addEventListener("click", () => {
    // Make YES bigger
    yesSize += 0.25;
    yesBtn.style.transform = `translateX(-50%) scale(${yesSize})`;

    // Move NO randomly (TikTok style)
    const x = Math.random() * 160 - 80;
    const y = Math.random() * 40 - 20;
    noBtn.style.transform = `translate(${x}px, ${y}px) scale(0.9)`;
  });

  yesBtn.addEventListener("click", () => {
    window.location.href = "yes.html";
  });
</script>

</body>
</html>
